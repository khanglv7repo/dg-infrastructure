name: CI

on:
  push:
    branches:
      - main
      - hotfix/architecture-correctness-2026-09-24
  pull_request:

jobs:
  runner-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install pytest flask pyyaml python-dotenv requests httpx

      - name: Compile integration code
        run: python -m compileall -q docker/metadata-ingestion/runner.py scripts/verify_governance_runtime.py tests scripts/ranger

      - name: Test integration contracts
        run: pytest -q tests scripts/ranger/tests
