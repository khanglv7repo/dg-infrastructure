name: ${COMPOSE_PROJECT_NAME:-dg}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:15.18-alpine}
    container_name: dg-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      OPENMETADATA_DB: ${OPENMETADATA_DB}
      OPENMETADATA_DB_USER: ${OPENMETADATA_DB_USER}
      OPENMETADATA_DB_PASSWORD: ${OPENMETADATA_DB_PASSWORD}
      FINANCIAL_DB: ${FINANCIAL_DB}
      TRINO_DB_USER: ${TRINO_DB_USER}
      TRINO_DB_PASSWORD: ${TRINO_DB_PASSWORD}
      # TASK-10: Backend/Agent database separation (see .env.example for the
      # full rationale). Consumed by docker/postgres-init/01-init.sh.
      GOVERNANCE_DB: ${GOVERNANCE_DB}
      GOVERNANCE_DB_USER: ${GOVERNANCE_DB_USER}
      GOVERNANCE_DB_PASSWORD: ${GOVERNANCE_DB_PASSWORD}
      AGENT_CHECKPOINT_DB: ${AGENT_CHECKPOINT_DB}
      AGENT_CHECKPOINT_DB_USER: ${AGENT_CHECKPOINT_DB_USER}
      AGENT_CHECKPOINT_DB_PASSWORD: ${AGENT_CHECKPOINT_DB_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      # TASK-10 hardening: runtime data bind sources must already exist.
      # Docker Compose short syntax silently creates missing host paths, which
      # can mask data loss by booting an empty database.
      - type: bind
        source: ./data/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [net]

  opensearch:
    image: ${OPENSEARCH_IMAGE:-opensearchproject/opensearch:2.19.1}
    container_name: dg-os
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms768m -Xmx768m"
    volumes:
      - type: bind
        source: ./data/opensearch
        target: /usr/share/opensearch/data
        bind:
          create_host_path: false

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&wait_for_no_initializing_shards=true&timeout=5s' | grep -q '\"timed_out\":false'"
        ]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 30s

    networks: [net]

  openmetadata:
    image: openmetadata/server:${OPENMETADATA_VERSION:-2.0.2}
    container_name: dg-om
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/opt/openmetadata/start-with-migration.sh"]
    environment:
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_SCHEME: postgresql
      DB_USE_SSL: "false"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${OPENMETADATA_DB_USER}
      DB_USER_PASSWORD: ${OPENMETADATA_DB_PASSWORD}
      OM_DATABASE: ${OPENMETADATA_DB}

      ELASTICSEARCH_HOST: opensearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_SCHEME: http
      SEARCH_TYPE: opensearch

      # A4 POC (docs/09_POC_SPECIFICATION.md): semantic search with OpenAI embeddings.
      # OpenMetadata 2.0.2 reads OpenAI credentials from llmConfiguration.openai
      # (LLM_OPENAI_API_KEY), while embedding model selection remains under
      # llmConfiguration.embeddings (OPENAI_EMBEDDING_MODEL_ID/DIMENSION).
      SEMANTIC_SEARCH_ENABLED: "true"
      LLM_ENABLED: "true"
      LLM_PROVIDER: openai
      LLM_OPENAI_API_KEY: ${LLM_OPENAI_API_KEY:-}
      EMBEDDING_PROVIDER: openai
      OPENAI_EMBEDDING_MODEL_ID: ${OPENAI_EMBEDDING_MODEL_ID:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSION: ${OPENAI_EMBEDDING_DIMENSION:-1536}

      AUTHENTICATION_PROVIDER: basic
      AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
      AUTHORIZER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
      AUTHORIZER_ADMIN_PRINCIPALS: "[admin]"
      AUTHORIZER_PRINCIPAL_DOMAIN: open-metadata.org
      AUTHENTICATION_PUBLIC_KEYS: "[http://localhost:8585/api/v1/system/config/jwks]"

      JWT_ISSUER: open-metadata.org
      JWT_KEY_ID: ${OPENMETADATA_JWT_KEY_ID:-local-dev-key}
      RSA_PUBLIC_KEY_FILE_PATH: ./conf/public_key.der
      RSA_PRIVATE_KEY_FILE_PATH: ./conf/private_key.der

      # Không dùng Airflow/Pipeline Service Client.
      PIPELINE_SERVICE_CLIENT_ENABLED: "false"

    ports:
      - "8585:8585"
      - "8586:8586"

    volumes:
      - ./docker/openmetadata/start-with-migration.sh:/opt/openmetadata/start-with-migration.sh:ro

    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c \"exec 3<>/dev/tcp/127.0.0.1/8586 && printf 'GET /healthcheck HTTP/1.0\r\n\r\n' >&3 && grep -q '200 OK' <&3\""
        ]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s

    networks: [net]

  metadata-ingestion:
    image: openmetadata/ingestion:${OPENMETADATA_VERSION:-2.0.2}
    container_name: dg-ingest
    restart: unless-stopped

    command: ["python", "/app/runner.py"]

    environment:
      OPENMETADATA_HOST: http://openmetadata:8585/api
      OM_INGESTION_BOT_TOKEN: ${OM_INGESTION_BOT_TOKEN}

      INGESTION_SERVICE_NAME: ${INGESTION_SERVICE_NAME:-financial_postgres}
      INGESTION_INTERVAL_SECONDS: ${INGESTION_INTERVAL_SECONDS:-3600}

      # Flask API trong container
      INGESTION_HTTP_HOST: 0.0.0.0
      INGESTION_HTTP_PORT: "8080"

      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: ${FINANCIAL_DB}
      POSTGRES_USER: ${TRINO_DB_USER}
      POSTGRES_PASSWORD: ${TRINO_DB_PASSWORD}

    # Host 8080 đã được Trino dùng.
    # Flask ingestion API expose ra localhost:8081
    ports:
      - "127.0.0.1:8081:8080"

    volumes:
      - ./docker/metadata-ingestion/runner.py:/app/runner.py:ro

    depends_on:
      openmetadata:
        condition: service_healthy
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)\""
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

    networks: [net]

  ranger-db:
    image: apache/ranger-db:${RANGER_VERSION:-2.8.0}
    container_name: dg-rdb
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${RANGER_DB_PASSWORD}
      RANGER_DB_USER: ${RANGER_DB_USER}
      RANGER_DB_PASSWORD: ${RANGER_DB_PASSWORD}
    ports:
      - "127.0.0.1:${RANGER_DB_HOST_PORT:-5433}:5432"
    volumes:
      - type: bind
        source: ./data/ranger-db
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RANGER_DB_USER} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 20s
    networks: [net]

  ranger-solr:
    image: apache/ranger-solr:${RANGER_VERSION:-2.8.0}
    container_name: dg-rsolr
    restart: unless-stopped
    command:
      [
        "solr-precreate",
        "ranger_audits",
        "/opt/solr/server/solr/configsets/ranger_audits/"
      ]
    volumes:
      - type: bind
        source: ./data/ranger-solr
        target: /var/solr
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8983/solr/ranger_audits/admin/ping >/dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 20s
    networks: [net]

  ranger-admin:
    image: apache/ranger:${RANGER_VERSION:-2.8.0}
    container_name: dg-ranger
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${RANGER_DB_PASSWORD}
      RANGER_DB_USER: ${RANGER_DB_USER}
      RANGER_DB_PASSWORD: ${RANGER_DB_PASSWORD}
    ports:
      - "6080:6080"
    depends_on:
      ranger-db:
        condition: service_healthy
      ranger-solr:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:6080/login.jsp >/dev/null || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s
    networks:
      net:
        aliases:
          - ranger-admin
          - ranger-admin.rangernw

  trino:
    image: trinodb/trino:${TRINO_VERSION:-482}
    container_name: dg-trino
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TRINO_DB_PASSWORD: ${TRINO_DB_PASSWORD}
    volumes:
      - ./docker/trino/etc:/etc/trino:ro
    depends_on:
      postgres:
        condition: service_healthy
      ranger-admin:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/v1/info | grep -q '\"starting\"[[:space:]]*:[[:space:]]*false'"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [net]

  redis:
    image: redis:7-alpine
    container_name: dg-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - type: bind
        source: ./data/redis
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [net]

  flower:
    image: mher/flower:2.0
    container_name: dg-flower
    restart: unless-stopped
    command: ["celery", "--broker=redis://redis:6379/0", "flower", "--port=5555"]
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks: [net]

  langgraph-agent:
    # TASK-09: LangGraph API server for app/graph.py (Studio UI / HTTP access
    # to the same graph GovernanceAgentRunner/the Celery worker already call
    # in-process -- this is an additional access path, not a replacement).
    #
    # Runs `langgraph dev` (agent/Dockerfile), NOT `langgraph build`'s own
    # production image -- found live: that image is the "licensed" variant
    # and refuses to start without LANGSMITH_API_KEY/LANGGRAPH_CLOUD_LICENSE_KEY
    # ("License verification failed"). `langgraph dev` has no such
    # requirement. The graph's own checkpoint state still persists for real
    # to the dedicated agent_checkpoint_db Postgres database regardless
    # (app/checkpointer.py, wired in app/langgraph_entry.py:graph()) -- only
    # the LangGraph API server's own run/thread bookkeeping layer is
    # in-memory in this mode, not the graph state itself.
    #
    # Rebuild after any agent/ code change:
    #   cd agent && docker build -t dg-agent-langgraph:dev -f Dockerfile .
    image: dg-agent-langgraph:dev
    container_name: dg-agent-langgraph
    restart: unless-stopped
    # Agent's own runtime env (LLM, Backend MCP/REST URLs, OM bot token,
    # AGENT_CHECKPOINT_DB* credentials, kill switches) -- one place
    # (agent/.env) owns these values; not duplicated into compose-level vars.
    env_file:
      - ../agent/.env
    environment:
      # agent/.env's own OPENMETADATA_MCP_URL/BACKEND_MCP_URL/BACKEND_API_URL/
      # AGENT_CHECKPOINT_DB_HOST all point at localhost/127.0.0.1, correct
      # when the Agent runs bare-metal on the host (Backend/OM's MCP/REST
      # processes also run outside Compose, confirmed live -- see this
      # session's TASK-08 audit). From inside this container, "localhost"
      # means the container itself, not the host.
      #
      # AGENT_CHECKPOINT_DB_HOST -> postgres: dg-pg runs IN this same Compose
      # network (dg-net), reachable by its service name directly -- found
      # live that host.docker.internal resolves to the default bridge
      # network's gateway (172.17.0.1), NOT dg-net, so it could not reach
      # dg-pg ("connection to server at 172.17.0.1, port 5432 ... Connection
      # refused").
      #
      # OM/Backend MCP/REST URLs -> host.docker.internal: those processes
      # genuinely run bare-metal on the host, outside Compose entirely, so
      # they need the host-gateway route (extra_hosts below).
      AGENT_CHECKPOINT_DB_HOST: postgres
      OPENMETADATA_MCP_URL: http://host.docker.internal:8585/mcp
      BACKEND_MCP_URL: http://host.docker.internal:8001/mcp
      BACKEND_API_URL: http://host.docker.internal:8000/api/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Opened to every interface (not just 127.0.0.1) so Agent Chat UI can
      # reach this from another machine on the LAN -- user explicitly
      # approved this after hitting the exact symptom (UI on a different
      # machine, localhost:2024 in its browser resolved to itself, not this
      # host). Safe only on a trusted local network, not the public internet.
      - "2024:2024"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:2024/docs >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [net]

networks:
  net:
    name: ${DOCKER_NETWORK_NAME:-dg-net}
    driver: bridge
