version: 1

service:
  name: dev_trino
  type: trino
  displayName: Development Trino
  description: Ranger service instance for local Data Governance Trino.
  isEnabled: true

  configs:
    username: trino
    password: ""
    jdbc.driverClassName: io.trino.jdbc.TrinoDriver
    jdbc.url: jdbc:trino://trino:8080